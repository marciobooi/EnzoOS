devices:
  samplerate: 44100
  chunksize: 512
  queuelimit: 4
  enable_resampling: true
  resampler_type: Synchronous
  capture:
    type: Alsa
    channels: 2
    device: hw:Loopback,1,0
    format: S16LE
  playback:
    type: Alsa
    channels: 2
    device: hw:IanCanadaDAC
    format: S32LE
    enable_dithering: true
filters:
  hp_crossover:
    type: Biquad
    parameters:
      type: Highpass
      freq: 80
      q: 0.707
  master_gain:
    type: Gain
    parameters:
      gain: 0
      inverted: false
pipeline:
  - type: Filter
    channel: 0
    names:
      - hp_crossover
      - master_gain
  - type: Filter
    channel: 1
    names:
      - hp_crossover
      - master_gain
