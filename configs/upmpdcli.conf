# upmpdcli configuration for UPnP / TIDAL
# This allows the streamer to act as an OpenHome/UPnP renderer,
# which can receive high-res streams like TIDAL from apps like mconnect or BubbleUPnP.

friendlyname = HiFi Streamer
upnpav = 1
openhome = 1
lumincompat = 1

# Connects directly to the local MPD daemon we configured earlier
mpdhost = localhost
mpdport = 6600

# TIDAL integration (Optional, if you want direct plugin rather than casting)
# tidaluser = your_tidal_username
# tidalpass = your_tidal_password
# tidalquality = lossless
