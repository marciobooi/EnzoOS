<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Resonance — Intro Animation (HTML/CSS)</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700;800&display=swap" rel="stylesheet" />
<style>
  :root{
    --gold:#d4af37;
    --purple:#8b47ff;
    --glow:#cdb4ff;
    --cycle:4.4s;            /* full loop length */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#05060c;
    font-family:'Manrope',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }

  /* ── stage ─────────────────────────────────────────────────────────── */
  .stage{
    position:relative;
    width:min(92vw,720px);
    aspect-ratio:16/9;
    border-radius:24px;
    overflow:hidden;
    background:
      radial-gradient(120% 90% at 50% 38%, #15203f 0%, #0a0e1d 55%, #05060c 100%);
    box-shadow:0 40px 120px rgba(0,0,0,.6), inset 0 0 0 1px rgba(255,255,255,.04);
  }
  /* soft moving aurora behind everything */
  .stage::before{
    content:"";position:absolute;inset:-20%;
    background:
      radial-gradient(40% 40% at 30% 40%, rgba(139,71,255,.22), transparent 70%),
      radial-gradient(36% 36% at 72% 62%, rgba(71,150,255,.16), transparent 70%);
    filter:blur(6px);
    animation:drift var(--cycle) ease-in-out infinite;
  }
  @keyframes drift{
    0%,100%{transform:translate(0,0) scale(1)}
    50%{transform:translate(2%, -2%) scale(1.05)}
  }

  .core{position:absolute;inset:0;display:grid;place-items:center}

  /* ── player transport row ──────────────────────────────────────────── */
  .player{
    position:relative;display:flex;align-items:center;gap:22px;
    padding:15px 30px;border-radius:60px;
    background:linear-gradient(180deg,rgba(42,55,95,.55),rgba(13,19,38,.6));
    box-shadow:0 22px 55px rgba(0,0,0,.55),
      inset 0 1px 0 rgba(255,255,255,.09), inset 0 0 0 1px rgba(255,255,255,.06);
    -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);
    animation:playerLife var(--cycle) ease-in-out infinite;
  }
  @keyframes playerLife{
    0%   {opacity:0;transform:translateY(14px) scale(.96)}
    7%   {opacity:1;transform:translateY(0) scale(1)}
    30%  {transform:translateY(0) scale(1)}
    34%  {transform:translateY(0) scale(1.07)}     /* shock from the burst */
    40%  {transform:translateY(0) scale(1)}
    52%  {opacity:.9;transform:translateY(104px) scale(.6)}   /* recede to the bottom */
    86%  {opacity:.9;transform:translateY(104px) scale(.6)}
    100% {opacity:0;transform:translateY(118px) scale(.58)}
  }

  .btn{
    width:54px;height:54px;border-radius:50%;
    display:grid;place-items:center;
    background:linear-gradient(145deg,#1b2750,#0d1428);
    box-shadow:
      0 6px 18px rgba(0,0,0,.5),
      inset 0 1px 0 rgba(255,255,255,.08),
      inset 0 0 0 1px rgba(255,255,255,.05);
    color:#9fb2d8;
  }
  .btn svg{width:20px;height:20px;fill:currentColor}
  .btn.main{
    width:78px;height:78px;color:#05060c;
    background:radial-gradient(circle at 50% 40%, #ffe7a3, var(--gold) 60%);
    box-shadow:
      0 0 0 0 rgba(212,175,55,.6),
      0 10px 30px rgba(212,175,55,.35),
      inset 0 1px 0 rgba(255,255,255,.5);
    animation:mainPulse var(--cycle) ease-in-out infinite;
  }
  .btn.main svg{width:30px;height:30px}
  @keyframes mainPulse{
    0%,20%{box-shadow:0 0 0 0 rgba(212,175,55,.0),0 10px 30px rgba(212,175,55,.25)}
    26%{box-shadow:0 0 26px 6px rgba(212,175,55,.55),0 10px 34px rgba(212,175,55,.5)}
    31%{box-shadow:0 0 60px 18px rgba(255,231,163,.85),0 10px 40px rgba(212,175,55,.7)}
    38%{box-shadow:0 0 18px 3px rgba(212,175,55,.3),0 10px 30px rgba(212,175,55,.3)}
    100%{box-shadow:0 0 0 0 rgba(212,175,55,0),0 10px 30px rgba(212,175,55,.2)}
  }

  /* ── orbiting energy orb (converges into play, then bursts) ────────── */
  .orbit{
    position:absolute;width:200px;height:200px;left:50%;top:50%;
    margin:-100px 0 0 -100px;border-radius:50%;
    animation:orbitSpin var(--cycle) cubic-bezier(.5,0,.3,1) infinite;
  }
  @keyframes orbitSpin{
    0%   {transform:rotate(0deg) scale(1);opacity:0}
    6%   {opacity:1}
    28%  {transform:rotate(540deg) scale(.18);opacity:1}  /* spiral into center */
    32%  {opacity:0}
    100% {opacity:0;transform:rotate(540deg) scale(.18)}
  }
  .orb{
    position:absolute;top:-7px;left:50%;width:14px;height:14px;margin-left:-7px;
    border-radius:50%;background:#fff;
    box-shadow:0 0 10px 4px var(--glow),0 0 22px 8px rgba(139,71,255,.7);
  }

  /* ── burst flash + ring at center ──────────────────────────────────── */
  .flash{
    position:absolute;left:50%;top:50%;width:20px;height:20px;margin:-10px 0 0 -10px;
    border-radius:50%;background:radial-gradient(circle,#fff,rgba(255,231,163,.6) 40%,transparent 70%);
    opacity:0;animation:flash var(--cycle) ease-out infinite;
  }
  @keyframes flash{
    0%,29%{opacity:0;transform:scale(.2)}
    32%{opacity:1;transform:scale(3.2)}
    42%{opacity:0;transform:scale(7)}
    100%{opacity:0}
  }
  .ring{
    position:absolute;left:50%;top:50%;width:80px;height:80px;margin:-40px 0 0 -40px;
    border-radius:50%;border:2px solid rgba(205,180,255,.8);opacity:0;
    animation:ring var(--cycle) ease-out infinite;
  }
  @keyframes ring{
    0%,30%{opacity:0;transform:scale(.3)}
    33%{opacity:.9;transform:scale(1)}
    48%{opacity:0;transform:scale(3.4)}
    100%{opacity:0}
  }

  /* ── sparks shooting out of the burst ──────────────────────────────── */
  .sparks{position:absolute;left:50%;top:50%}
  .spark{
    position:absolute;width:5px;height:5px;border-radius:50%;
    width:6px;height:6px;
    background:#fff;box-shadow:0 0 12px 3px var(--gold),0 0 4px 1px #fff;
    opacity:0;
    transform:rotate(var(--a)) translateX(0);
    animation:spark var(--cycle) ease-out infinite;
  }
  @keyframes spark{
    0%,30%{opacity:0;transform:rotate(var(--a)) translateX(0) scale(1)}
    33%{opacity:1}
    46%{opacity:1;transform:rotate(var(--a)) translateX(var(--d)) scale(.7)}
    56%{opacity:0;transform:rotate(var(--a)) translateX(calc(var(--d) * 1.25)) scale(.2)}
    100%{opacity:0}
  }

  /* ── RESONANCE wordmark reveal ─────────────────────────────────────── */
  .word{
    position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);
    text-align:center;
    font-weight:800;letter-spacing:.34em;
    font-size:clamp(26px,6vw,58px);
    color:transparent;
    background:linear-gradient(180deg,#ffffff,#cdb4ff 60%,#8b47ff);
    -webkit-background-clip:text;background-clip:text;
    text-shadow:0 0 30px rgba(139,71,255,.0);
    /* reveal from center outwards via clip */
    clip-path:inset(0 50% 0 50%);
    opacity:0;
    animation:word var(--cycle) cubic-bezier(.2,.7,.2,1) infinite;
  }
  @keyframes word{
    0%,33%{opacity:0;clip-path:inset(0 50% 0 50%);transform:translateY(-50%) scale(.96);filter:drop-shadow(0 0 0 rgba(139,71,255,0))}
    40%{opacity:1}
    52%{opacity:1;clip-path:inset(0 0 0 0);transform:translateY(-50%) scale(1);filter:drop-shadow(0 0 26px rgba(139,71,255,.55))}
    82%{opacity:1;clip-path:inset(0 0 0 0);filter:drop-shadow(0 0 18px rgba(139,71,255,.4))}
    96%,100%{opacity:0;filter:drop-shadow(0 0 0 rgba(139,71,255,0))}
  }
  /* light bar that sweeps across the text as it appears */
  .sweep{
    position:absolute;left:0;right:0;top:50%;height:1.4em;transform:translateY(-50%);
    pointer-events:none;mix-blend-mode:screen;opacity:0;
    background:linear-gradient(100deg,transparent 42%,rgba(255,255,255,.9) 50%,transparent 58%);
    background-size:250% 100%;background-position:120% 0;
    animation:sweep var(--cycle) ease-out infinite;
  }
  @keyframes sweep{
    0%,36%{opacity:0;background-position:120% 0}
    44%{opacity:.9}
    60%{opacity:.9;background-position:-40% 0}
    66%,100%{opacity:0}
  }

  .label{
    position:absolute;left:0;right:0;bottom:18px;text-align:center;
    color:#5b6b8c;font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    font-weight:600;opacity:.7;
  }
</style>
</head>
<body>
  <div class="stage">
    <div class="core">
      <!-- transport player -->
      <div class="player">
        <div class="btn"><svg viewBox="0 0 24 24"><path d="M6 6h2v12H6zM20 6 9 12l11 6z"/></svg></div>
        <div class="btn main"><svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></div>
        <div class="btn"><svg viewBox="0 0 24 24"><path d="M16 6h2v12h-2zM4 6l11 6L4 18z"/></svg></div>
      </div>

      <!-- energy orb spiralling into the play button -->
      <div class="orbit"><span class="orb"></span></div>

      <!-- burst -->
      <div class="flash"></div>
      <div class="ring"></div>
      <div class="sparks">
        <i class="spark" style="--a:0deg;--d:150px"></i>
        <i class="spark" style="--a:45deg;--d:120px"></i>
        <i class="spark" style="--a:90deg;--d:160px"></i>
        <i class="spark" style="--a:135deg;--d:115px"></i>
        <i class="spark" style="--a:180deg;--d:150px"></i>
        <i class="spark" style="--a:225deg;--d:120px"></i>
        <i class="spark" style="--a:270deg;--d:155px"></i>
        <i class="spark" style="--a:315deg;--d:120px"></i>
      </div>

      <!-- wordmark -->
      <div class="word">RESONANCE</div>
      <div class="sweep"></div>
    </div>
    <div class="label">html · css only</div>
  </div>
</body>
</html>
